    <section class="sial-card sial-card-pad farm-consult-section" data-authorized hidden>

      </div>

          <button type="button" class="sial-segment-option" data-value="Registrado" aria-pressed="false" aria-label="Registrado">Registrado</button>
          <button type="button" class="sial-segment-option" data-value="Con novedad" aria-pressed="false" aria-label="Con novedad">Con novedad</button>

      <div class="farm-consult-section-heading"><span class="farm-consult-section-icon"><svg class="sial-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 7h13v10H2zM15 10h4l3 4v3h-7M5 17v2h2v-2m10 0v2h2v-2"/></svg></span><div><h2 class="sial-section-title">Salidas registradas</h2><p id="count" aria-live="polite"></p></div></div>
